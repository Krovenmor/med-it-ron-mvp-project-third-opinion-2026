services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: meditron
      POSTGRES_PASSWORD: meditron
      POSTGRES_DB: meditron
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meditron -d meditron"]
      interval: 2s
      timeout: 3s
      retries: 15

  b2b-service:
    build: ./services/b2b-service
    env_file:
      - ./services/b2b-service/config/default.env
      - ./services/b2b-service/config/docker.env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started

  mis-demo:
    build: ./services/mis-demo
    env_file:
      - ./services/mis-demo/config/default.env
      - ./services/mis-demo/config/docker.env
    ports:
      - "8081:8081"

  b2c-service:
    build: ./services/b2c-service
    env_file:
      - ./services/b2c-service/config/default.env
      - ./services/b2c-service/config/docker.env
    ports:
      - "8082:8082"

  ai-service:
    build: ./services/ai-service
    env_file:
      - ./services/ai-service/config/default.env
      # Секреты (ключ GigaChat). Файла может не быть — тогда сервис стартует, но оценки будут падать.
      - path: ./services/ai-service/.env
        required: false
      # Последним, чтобы адреса для docker-сети перекрывали локальные значения из .env.
      - ./services/ai-service/config/docker.env
    volumes:
      - ./services/ai-service/certs:/srv/certs:ro
    # Только localhost: авторизации нет, а каждый запрос тратит токены GigaChat.
    # b2b-service ходит сюда по docker-сети, проброс порта ему не нужен.
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      - mis-demo

  frontend-service:
    build: ./web
    env_file:
      - ./web/config/docker.env
    ports:
      - "3000:80"
    depends_on:
      - b2b-service
      - mis-demo
      - b2c-service

volumes:
  postgres-data:
