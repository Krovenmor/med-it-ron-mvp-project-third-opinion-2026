services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: meditron
      POSTGRES_PASSWORD: meditron
      POSTGRES_DB: meditron
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meditron -d meditron"]
      interval: 2s
      timeout: 3s
      retries: 15

  b2b-service:
    build: ./services/b2b-service
    env_file:
      - ./services/b2b-service/config/default.env
      - ./services/b2b-service/config/docker.env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  mis-demo:
    build: ./services/mis-demo
    env_file:
      - ./services/mis-demo/config/default.env
      - ./services/mis-demo/config/docker.env
    ports:
      - "8081:8081"

  b2c-service:
    build: ./services/b2c-service
    env_file:
      - ./services/b2c-service/config/default.env
      - ./services/b2c-service/config/docker.env
    ports:
      - "8082:8082"

volumes:
  postgres-data:
